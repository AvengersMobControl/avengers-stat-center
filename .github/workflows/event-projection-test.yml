name: Test staged event projection
on:
  pull_request:
    paths:
      - 'scripts/event-projection*.cjs'
      - 'scripts/stage-event-update*.cjs'
      - 'scripts/assemble-result-review*.cjs'
      - 'scripts/verify-result-image-proofs*.cjs'
      - 'scripts/audit-result-pagination*.cjs'
      - 'scripts/hash-original-image*.cjs'
      - 'scripts/fetch-original-discord-image*.cjs'
      - 'scripts/verify-live-pages*.cjs'
      - 'scripts/build-site.cjs'
      - 'scripts/plan-event-summary-dispatch*.cjs'
      - 'scripts/private-summary-publication*.cjs'
      - 'scripts/private-dispatch-ledger-adapter*.cjs'
      - 'scripts/private-discord-authenticated-readback*.cjs'
      - 'database/migrations/*.sql'
      - 'scripts/private-dispatch-role.test.cjs'
      - 'scripts/private-dispatch-readiness*.cjs'
      - 'scripts/private-dispatch-schema.test.cjs'
      - 'scripts/render-event-summary.py'
      - 'scripts/test_render_event_summary.py'
      - 'scripts/render-piggy-finish-pb-preview.py'
      - 'scripts/test_render_piggy_finish_pb_preview.py'
      - 'scripts/export-event-summary*.cjs'
      - 'scripts/export-weekly-review*.cjs'
      - 'scripts/render-weekly-event-review.py'
      - 'scripts/test_render_weekly_event_review.py'
      - 'scripts/*site*.cjs'
      - 'scripts/export-event-summary*.cjs'
      - 'scripts/migrate-event-ledger.cjs'
      - 'data/approved-event-updates.json'
      - 'data/event-png-template-approvals.json'
      - 'index.html'
      - '*.js'
      - '.github/workflows/pages.yml'
      - 'scripts/audit-six-clan-leagues*.cjs'
      - 'scripts/audit-event-projection-migration.cjs'
      - 'scripts/council-minimums-core.cjs'
      - '.github/workflows/event-projection-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/event-projection*.cjs'
      - 'scripts/stage-event-update*.cjs'
      - 'scripts/assemble-result-review*.cjs'
      - 'scripts/verify-result-image-proofs*.cjs'
      - 'scripts/audit-result-pagination*.cjs'
      - 'scripts/hash-original-image*.cjs'
      - 'scripts/*site*.cjs'
      - 'scripts/migrate-event-ledger.cjs'
      - 'data/approved-event-updates.json'
      - 'data/event-png-template-approvals.json'
      - 'index.html'
      - '*.js'
      - '.github/workflows/pages.yml'
      - 'scripts/audit-event-projection-migration.cjs'
      - 'scripts/council-minimums-core.cjs'
      - '.github/workflows/event-projection-test.yml'
permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/reward-metrics.test.cjs scripts/event-projection-core.test.cjs scripts/council-minimums-core.test.cjs scripts/roster-event-breakdown.test.cjs scripts/roster-piggy-pb-rank.test.cjs scripts/space-rank-history.test.cjs scripts/sparks-ui-source.test.cjs scripts/site-release.test.cjs scripts/piggy-oct18-accepted.test.cjs scripts/piggy-benchmarks.test.cjs scripts/stage-event-update.test.cjs scripts/assemble-result-review.test.cjs scripts/verify-result-image-proofs.test.cjs scripts/audit-result-pagination.test.cjs scripts/hash-original-image.test.cjs scripts/fetch-original-discord-image.test.cjs scripts/verify-live-pages.test.cjs scripts/export-event-summary.test.cjs scripts/export-weekly-review.test.cjs scripts/plan-event-summary-dispatch.test.cjs scripts/private-summary-publication-state.test.cjs scripts/private-dispatch-schema.test.cjs scripts/private-dispatch-role.test.cjs scripts/private-dispatch-readiness.test.cjs scripts/private-dispatch-ledger-adapter.test.cjs scripts/private-discord-authenticated-readback.test.cjs scripts/audit-six-clan-leagues.test.cjs
      - name: Verify six canonical event PNG previews
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 -m unittest discover -s scripts -p test_render_event_summary.py -v
          python3 -m unittest discover -s scripts -p test_render_piggy_finish_pb_preview.py -v
          python3 -m unittest discover -s scripts -p test_render_weekly_event_review.py -v
          node scripts/export-weekly-review.cjs weekly-AVENGERS-2026-10-12.json 2026-10-12 AVENGERS
          node scripts/export-event-summary.cjs approved-summary-release.json
          for kind in piggy flash kraken; do
            for clan in AVENGERS AV-2; do
              python3 scripts/render-event-summary.py reports/approved-summary-release.json "reports/event-summary-preview-${kind}-${clan}.png" --kind "$kind" --clan "$clan"
            done
          done
          # Separate unapproved new Piggy artwork for leader visual review only.
          python3 scripts/render-piggy-finish-pb-preview.py reports/approved-summary-release.json reports/event-summary-preview-piggy-finish-ranks-AVENGERS.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avengers-weekly-review-source-2026-10-12
          path: |
            reports/weekly-AVENGERS-2026-10-12.json
            reports/weekly-AVENGERS-2026-10-12.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-summary-png-previews
          path: |
            reports/event-summary-preview-*.png
            reports/event-summary-preview-*.json
          if-no-files-found: ignore
      - name: Independently verify six league category totals and source coverage
        run: node scripts/audit-six-clan-leagues.cjs
      - name: Inventory legacy migration blockers (read only)
        run: node scripts/audit-event-projection-migration.cjs
      - name: Preserve current 100-member accounting invariants
        run: node scripts/audit-roster-reconciliation.cjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify built site in a real browser
        run: node scripts/site-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-evidence
          path: |
            reports/site-browser-*.png
            reports/clan-league-ledger-audit.*
          if-no-files-found: ignore
