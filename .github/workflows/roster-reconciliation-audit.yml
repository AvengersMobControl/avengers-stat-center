name: Audit roster and event ledger
on:
  pull_request:
    paths:
      - 'index.html'
      - '*-snapshot*.js'
      - 'roster-*.js'
      - 'clan-league-rewards.js'
      - 'scripts/council-minimums-core.cjs'
      - 'scripts/council-minimums-core.test.cjs'
      - 'scripts/report-council-minimums.cjs'
      - 'scripts/audit-roster-reconciliation.cjs'
      - 'scripts/roster-event-breakdown.test.cjs'
      - 'scripts/audit-sparks-root-cause.cjs'
      - '.github/workflows/roster-reconciliation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test independent per-event Spark category calculation
        run: node --test scripts/roster-event-breakdown.test.cjs
      - name: Check roster identities and reconcile rewards
        run: node scripts/audit-roster-reconciliation.cjs
      - name: Diagnose Spark ledger inflation across all current members
        run: node scripts/audit-sparks-root-cause.cjs
      - name: Check Council compliance policy on synthetic historical fixtures
        run: node --test scripts/council-minimums-core.test.cjs
      - name: Generate evidence-only Council minimums report from real event ledger
        run: node scripts/report-council-minimums.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-reconciliation-audit
          path: |
            reports/roster-reconciliation-audit.*
            reports/clan-league-audit.*
            reports/council-minimums-audit.*
            reports/sparks-root-cause-diagnostic.*
          if-no-files-found: warn
