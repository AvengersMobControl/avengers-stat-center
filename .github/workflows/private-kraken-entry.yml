name: Private Kraken entry
on:
  push:
    branches: [feat/private-kraken-member-intake-20261112]
  pull_request:
    paths:
      - 'api/kraken/**'
      - 'api/discord/kraken-interactions.js'
      - 'server/kraken-entry-*.cjs'
      - 'database/migrations/004_private_kraken_entry.sql'
      - 'scripts/kraken-entry.test.cjs'
      - '.github/workflows/private-kraken-entry.yml'
jobs:
  private-kraken-entry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JS syntax
        run: |
          node --check api/kraken/form.js
          node --check api/kraken/data.js
          node --check api/discord/kraken-interactions.js
          node --check server/kraken-entry-auth.cjs
          node --check server/kraken-entry-core.cjs
          node --check server/kraken-entry-store.cjs
          node --check server/kraken-entry-identity.cjs
      - name: Execute Kraken security and form logic tests
        run: node --test scripts/kraken-entry.test.cjs
