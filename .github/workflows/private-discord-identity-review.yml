name: Private Discord identity review
on:
  push:
    branches: [feat/private-discord-roster-review]
  pull_request:
    paths:
      - 'api/discord/identity-review.js'
      - 'server/discord-identity-review.cjs'
      - 'scripts/discord-identity-review.test.cjs'
      - '.github/workflows/private-discord-identity-review.yml'
jobs:
  identity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check api/discord/identity-review.js
          node --check server/discord-identity-review.cjs
          node --check scripts/discord-identity-review.test.cjs
      - name: Private member export and identity match tests
        run: node --test scripts/discord-identity-review.test.cjs
