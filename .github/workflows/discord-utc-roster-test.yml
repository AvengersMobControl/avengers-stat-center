name: Test Discord UTC roster

on:
  pull_request:
    paths:
      - 'scripts/sync-discord-utc.cjs'
      - 'scripts/sync-discord-utc.test.cjs'
      - 'member-timezones-source.js'
      - '.github/workflows/discord-utc-roster-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/sync-discord-utc.test.cjs
