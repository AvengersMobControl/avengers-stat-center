name: Audit roster and event ledger
on:
  pull_request:
    paths:
      - 'index.html'
      - '*-snapshot*.js'
      - 'roster-*.js'
      - 'phase2.js'
      - 'community-highlights.js'
      - 'kraken.js'
      - 'scripts/sparks-ui-source.test.cjs'
      - 'clan-league-rewards.js'
      - 'scripts/council-minimums-core.cjs'
      - 'scripts/council-minimums-core.test.cjs'
      - 'scripts/report-council-minimums.cjs'
      - 'scripts/audit-roster-reconciliation.cjs'
      - 'scripts/audit-six-clan-leagues*.cjs'
      - 'scripts/report-prior-logging-sparks.cjs'
      - 'data/sparks-prior-to-logging-2026-10-16.json'
      - 'data/approved-post-kraken-no-spark-sets.json'
      - 'scripts/audit-transfer-restorations.cjs'
      - 'scripts/roster-event-breakdown.test.cjs'
      - 'scripts/roster-piggy-pb-rank.test.cjs'
      - 'scripts/audit-sparks-root-cause.cjs'
      - '.github/workflows/roster-reconciliation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test independent per-event Spark category calculation
        run: node --test scripts/roster-event-breakdown.test.cjs
      - name: Validate sortable Piggy personal-best roster ranks
        run: node --test scripts/roster-piggy-pb-rank.test.cjs
      - name: Check consistency of player, Kraken and achievements Spark displays
        run: node --test scripts/sparks-ui-source.test.cjs
      - name: Check roster identities and reconcile rewards
        run: node scripts/audit-roster-reconciliation.cjs
      - name: Generate fixed prior-to-logging Sparks roster report
        run: node scripts/report-prior-logging-sparks.cjs
      - name: Diagnose Spark ledger inflation across all current members
        run: node scripts/audit-sparks-root-cause.cjs
      - name: Check Council compliance policy on synthetic historical fixtures
        run: node --test scripts/council-minimums-core.test.cjs
      - name: Generate evidence-only Council minimums report from real event ledger
        run: node scripts/report-council-minimums.cjs
      - name: Audit all six Clan Leagues against canonical event results
        run: |
          node --test scripts/audit-six-clan-leagues.test.cjs
          node scripts/audit-six-clan-leagues.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-reconciliation-audit
          path: |
            reports/roster-reconciliation-audit.*
            reports/clan-league-audit.*
            reports/clan-league-ledger-audit.*
            reports/council-minimums-audit.*
            reports/sparks-root-cause-diagnostic.*
            reports/sparks-transfer-restorations.*
            reports/prior-to-logging-sparks.*
            reports/official-unlogged-sparks.*
          if-no-files-found: warn
