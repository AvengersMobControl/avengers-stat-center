name: Deploy AVENGERS Stat Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full-site projections before publication
        run: node --test scripts/event-projection-core.test.cjs scripts/site-release.test.cjs scripts/assemble-result-review.test.cjs scripts/audit-result-pagination.test.cjs scripts/hash-original-image.test.cjs scripts/fetch-original-discord-image.test.cjs scripts/verify-live-pages.test.cjs
      - name: Stage a coherent versioned site
        run: node scripts/build-site.cjs
      - name: Install browser verification dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify rendered pages before publication
        run: node scripts/site-browser-smoke.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact published Pages commit, exports and browser
        id: live_verify
        env:
          AVENGERS_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          AVENGERS_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-live-pages.cjs
      - name: Report exact live Pages verification on source commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.live_verify.outcome }}';
            const passed = outcome === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'AVENGERS GitHub Pages production',
              description: passed
                ? 'Exact Pages SHA, exports and public browser verified'
                : 'GitHub Pages public post-deploy verification incomplete or failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
