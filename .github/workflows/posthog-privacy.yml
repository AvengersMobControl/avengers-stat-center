name: AVENGERS telemetry privacy contract
on:
  pull_request:
    paths:
      - 'scripts/posthog-operations*.cjs'
      - '.github/workflows/posthog-privacy.yml'
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/posthog-operations.test.cjs
