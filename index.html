<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#08111f" />
  <title>AVENGERS Stat Center</title>
  <style>

:root{
  --bg:#07101d;
  --bg2:#0a1424;
  --panel:#0f1c30;
  --panel2:#14233b;
  --line:#263a57;
  --text:#f5f8ff;
  --muted:#91a5bf;
  --purple:#815cff;
  --purple2:#a476ff;
  --cyan:#43d7ff;
  --green:#5fe28b;
  --yellow:#ffd35c;
  --orange:#ff9a55;
  --red:#ff6b78;
  --shadow:0 20px 55px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% 0%,rgba(129,92,255,.14),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid #1d3049;background:linear-gradient(180deg,#0a1424 0%,#08111f 100%);padding:22px 16px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
.brand-mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--purple),#4e34c7);font-weight:900;font-size:25px;box-shadow:0 10px 30px rgba(129,92,255,.25)}
.brand-title{font-weight:900;letter-spacing:.08em}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.18em;margin-top:2px}
.nav{display:grid;gap:7px}
.nav-btn{border:0;background:transparent;color:#a9b9cc;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-weight:650}
.nav-btn span{width:22px;text-align:center}
.nav-btn:hover{background:#12213a;color:#fff}
.nav-btn.active{background:linear-gradient(90deg,rgba(129,92,255,.22),rgba(129,92,255,.06));color:#fff;border:1px solid rgba(129,92,255,.24)}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid #1c2e46}
.small-label{font-size:10px;letter-spacing:.14em;color:#6f849d;font-weight:800}
.source-name{font-size:13px;margin-top:6px;font-weight:700}
.source-time{font-size:11px;color:var(--muted);margin-top:3px}
.main{min-width:0}
.topbar{height:92px;border-bottom:1px solid #1b2d45;display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;background:rgba(7,16,29,.92);backdrop-filter:blur(14px);z-index:15}
.topbar h1{font-size:24px;margin:0 0 4px}
.topbar p{margin:0;color:var(--muted);font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:9px;align-items:center}
select,input{background:#0d1a2c;border:1px solid #263a57;color:#eaf1fa;border-radius:9px;padding:9px 11px;outline:none}
select:focus,input:focus{border-color:var(--purple)}
.ghost-btn{border:1px solid #2a405f;color:#dbe7f5;background:#0d1a2b;padding:9px 12px;border-radius:9px;font-weight:650}
.ghost-btn:hover{border-color:#577496;background:#12233b}
.menu-btn{display:none;border:0;background:transparent;color:white;font-size:22px}
.page{display:none;padding:26px 28px 42px}
.page.active{display:block}
.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.kpi{background:linear-gradient(180deg,#11203a,#0d1a2d);border:1px solid #213653;border-radius:15px;padding:17px 18px;box-shadow:0 7px 25px rgba(0,0,0,.12)}
.kpi-label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.kpi-value{font-size:28px;font-weight:900;margin-top:8px;letter-spacing:-.03em}
.kpi-note{font-size:11px;color:#7e93ad;margin-top:4px}
.content-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.card{background:linear-gradient(180deg,rgba(18,34,59,.96),rgba(12,25,44,.96));border:1px solid #223855;border-radius:15px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.card-header{padding:16px 18px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20334e}
.card-title{font-weight:850}
.card-sub{font-size:11px;color:var(--muted);margin-top:2px}
.card-body{padding:16px 18px}
.chart-wrap{height:210px}
.chart-wrap svg{width:100%;height:100%;overflow:visible}
.chart-grid-line{stroke:#233853;stroke-width:1}
.chart-line{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#areaGradient);opacity:.35}
.chart-dot{fill:#fff;stroke:var(--cyan);stroke-width:2}
.chart-label{fill:#8297b1;font-size:10px}
.chart-y-label{fill:#7186a3;font-size:9px}
.chart-value-label{fill:#dceeff;font-size:9px;font-weight:800;paint-order:stroke;stroke:#0b1728;stroke-width:3px;stroke-linejoin:round}
.dual-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-rank{display:grid;gap:8px}
.rank-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1e324c}
.rank-row:last-child{border-bottom:0}
.rank-num{width:28px;height:28px;border-radius:8px;background:#192a44;color:#a9bdd5;display:grid;place-items:center;font-size:12px;font-weight:800}
.rank-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-meta{font-size:11px;color:var(--muted)}
.rank-score{font-weight:900}
.section-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.segmented{display:flex;background:#0d1a2b;border:1px solid #223752;border-radius:10px;padding:3px;gap:3px}
.segmented button{border:0;color:#96abc4;background:transparent;padding:8px 13px;border-radius:7px;font-weight:700;font-size:13px}
.segmented button.active{background:#203553;color:white;box-shadow:inset 0 0 0 1px #355275}
.toolbar-right{display:flex;gap:8px}
.table-card{background:#0d1a2c;border:1px solid #223752;border-radius:14px;overflow:hidden}
.table-titlebar{padding:14px 16px;border-bottom:1px solid #21344e;display:flex;align-items:center;justify-content:space-between}
.table-titlebar h2{font-size:17px;margin:0}
.table-titlebar .small-muted{margin-top:3px}
.table-wrap{overflow:auto;max-height:calc(100vh - 245px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:3;background:#11213a;color:#9db1c8;font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:11px 12px;border-bottom:1px solid #2a405e;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid #1c3049;color:#dce6f2;white-space:nowrap}
tbody tr:hover{background:#12243d}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.player-cell{display:flex;align-items:center;gap:9px;font-weight:730}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#7351ff,#1eb7df);font-size:11px;font-weight:900;color:white;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.status{display:inline-flex;padding:3px 7px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.03em}
.status.active{background:rgba(95,226,139,.12);color:#7cf1a2}
.status.av2{background:rgba(255,211,92,.12);color:#ffda72}
.status.inactive{background:rgba(145,165,191,.10);color:#8294aa}
.metric-bar{position:relative;min-width:110px}
.metric-bar::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:var(--w,0%);border-radius:4px;background:linear-gradient(90deg,rgba(88,225,143,.24),rgba(88,225,143,.06));z-index:0}
.metric-bar span{position:relative;z-index:1}
.positive{color:#6bea98;font-weight:800}
.negative{color:#ff7e89;font-weight:800}
.callout-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.callout-list{display:grid;gap:9px}
.callout{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;background:#12233b;border:1px solid #223958}
.callout-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(129,92,255,.16)}
.callout-name{font-weight:800}
.callout-detail{font-size:11px;color:var(--muted);margin-top:2px}
.empty{color:#7f93ad;padding:30px;text-align:center}
.players-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.players-toolbar input{width:min(420px,100%)}
.small-muted{font-size:11px;color:var(--muted)}
.player-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.player-card{background:linear-gradient(180deg,#11203a,#0e1a2e);border:1px solid #223752;border-radius:13px;padding:14px;text-align:left;color:white}
.player-card:hover{border-color:#49698e;transform:translateY(-1px)}
.player-top{display:flex;align-items:center;gap:10px}
.player-card .avatar{width:34px;height:34px}
.player-card-name{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rating-large{font-size:24px;font-weight:900;margin-top:12px}
.rating-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.player-mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.mini-stat{padding:8px;background:#0c1829;border-radius:8px}
.mini-stat strong{display:block;font-size:13px}
.mini-stat span{font-size:9px;color:#778ca6;text-transform:uppercase}
.records-note{margin:0 0 14px;padding:11px 13px;border:1px solid #263a57;border-left:3px solid #43d7ff;border-radius:10px;background:#0b192b;color:#9db2ca;font-size:12px}
.records-note strong{color:#e9f2ff}
.records-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.record-card .card-body{padding-top:8px}
.record-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;padding:9px 0;border-bottom:1px solid #20334d;align-items:center}
.record-row:last-child{border-bottom:0}
.record-badge{color:#ffd463;font-weight:900}
.record-player{display:flex;align-items:center;gap:7px;min-width:0}
.record-player .linkish{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.record-player .status{flex:0 0 auto;padding:2px 6px;font-size:9px}
.record-value{font-weight:900;white-space:nowrap}
.benchmark{margin-top:12px;padding:10px;border-radius:9px;background:#0b192b;color:#9db2ca;font-size:11px}
.modal{display:none;position:fixed;inset:0;z-index:100}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(2,7,14,.76);backdrop-filter:blur(5px)}
.modal-card{position:relative;z-index:2;width:min(900px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;margin:14px auto;background:#0d1a2c;border:1px solid #2a4263;border-radius:18px;box-shadow:var(--shadow);padding:22px}
.modal-close{position:absolute;right:14px;top:10px;border:0;background:transparent;color:#9fb2c9;font-size:28px}
.profile-head{display:flex;align-items:center;gap:14px;padding-right:30px}
.profile-head .avatar{width:50px;height:50px;font-size:17px}
.profile-name{font-size:24px;font-weight:900}
.profile-status{margin-top:4px}
.profile-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0}
.profile-kpi{background:#111f36;border:1px solid #203754;border-radius:10px;padding:10px}
.profile-kpi span{display:block;color:#7e94af;font-size:9px;text-transform:uppercase}
.profile-kpi strong{display:block;margin-top:5px;font-size:15px}
.profile-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.profile-chart{background:#0a1728;border:1px solid #1e344f;border-radius:11px;padding:12px}
.profile-chart h3{font-size:13px;margin:0 0 8px}
.trend-up{color:var(--green)}
.trend-down{color:var(--red)}
.notice{padding:12px 14px;border:1px solid rgba(67,215,255,.22);background:rgba(67,215,255,.07);border-radius:10px;color:#a9cfe0;font-size:12px;margin-bottom:16px}
.roster-sort-btn{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;padding:0;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.roster-sort-btn span{font-size:9px;opacity:.5}
.roster-sort-btn:hover,.roster-sort-btn.active{color:#fff}
.roster-sort-btn.active span{opacity:1;color:var(--cyan)}


@media(max-width:1150px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .player-grid{grid-template-columns:repeat(3,1fr)}
  .profile-kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;width:240px;transition:left .2s}
  .sidebar.open{left:0;box-shadow:20px 0 60px rgba(0,0,0,.55)}
  .menu-btn{display:block}
  .content-grid,.dual-cards,.callout-grid,.records-grid,.profile-charts{grid-template-columns:1fr}
  .player-grid{grid-template-columns:repeat(2,1fr)}
  .section-toolbar{align-items:flex-start;flex-direction:column}
  .toolbar-right{width:100%}
  .toolbar-right select{flex:1}
}
@media(max-width:600px){
  .page{padding:18px 14px 32px}
  .topbar{height:auto;min-height:78px;padding:13px 14px}
  .top-actions{display:none}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px}
  .kpi-value{font-size:22px}
  .player-grid{grid-template-columns:1fr}
  .profile-kpis{grid-template-columns:repeat(2,1fr)}
  .segmented{width:100%;overflow:auto}
  .segmented button{white-space:nowrap}
}
@media print{
  .sidebar,.topbar,.section-toolbar,.players-toolbar,.modal{display:none!important}
  .app-shell{display:block}
  body{background:white;color:#111}
  .page{display:none!important;padding:0}
  .page.active{display:block!important}
  .card,.table-card,.kpi,.player-card{box-shadow:none;border:1px solid #bbb;background:white;color:#111}
  thead th{position:static;background:#eee;color:#222}
  tbody td{color:#111}
}

  </style>
  <link rel="stylesheet" href="phase2.css" />
  <link rel="stylesheet" href="avengers-theme.css" />
  <link rel="stylesheet" href="kraken.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-title">AVENGERS</div>
          <div class="brand-sub">STAT CENTER</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-page="overview"><span>🏠</span> Overview</button>
        <button class="nav-btn" data-page="rosters"><span>👥</span> Rosters</button>
        <button class="nav-btn" data-page="piggy"><span>🐷</span> Piggy Race</button>
        <button class="nav-btn" data-page="space"><span>🚀</span> Space Race</button>
        <button class="nav-btn" data-page="kraken"><span>🐙</span> Kraken</button>
        <button class="nav-btn" data-page="trends"><span>📈</span> Trends</button>
        <button class="nav-btn" data-page="eventTotals"><span>📊</span> Event Totals</button>
        <button class="nav-btn" data-page="ratings"><span>⭐</span> Player Ratings</button>
        <button class="nav-btn" data-page="players"><span>🧑‍🚀</span> Players</button>
        <button class="nav-btn" data-page="records"><span>🏆</span> Records</button>
      </nav>

      <div class="sidebar-foot">
        <div class="small-label">DATA SOURCE</div>
        <div class="source-name">Avengers Scorelog</div>
        <div class="source-time" id="generatedAt"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" aria-label="Menu">☰</button>
        <div>
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSubtitle">Clan performance at a glance</p>
        </div>
        <div class="top-actions">
          <select id="globalStatusFilter" title="Roster filter">
            <option value="active" selected>AVENGERS</option>
            <option value="av2">AV-2</option>
            <option value="all">All tracked</option>
          </select>
          <button class="ghost-btn" id="printBtn">Print View</button>
        </div>
      </header>

      <section class="page active" id="page-overview">
        <div id="overviewContent"></div>
      </section>

      <section class="page" id="page-rosters">
        <div id="rostersContent"></div>
      </section>

      <section class="page" id="page-piggy">
        <div class="section-toolbar">
          <div class="segmented" id="piggyTabs">
            <button class="active" data-view="overall">Overall</button>
            <button data-view="event">Event</button>
            <button data-view="last3">Last 3</button>
            <button data-view="pot">Pot Totals</button>
            <button data-view="pbs">PBs & New</button>
          </div>
          <div class="toolbar-right">
            <select id="piggyEventSelect"></select>
            <button class="ghost-btn" data-export="piggy">Export CSV</button>
          </div>
        </div>
        <div id="piggyContent"></div>
      </section>

      <section class="page" id="page-space">
        <div class="section-toolbar">
          <div class="segmented" id="spaceTabs">
            <button class="active" data-view="overall">Overall</button>
            <button data-view="event">Event</button>
            <button data-view="last3">Last 3</button>
            <button data-view="pot">Pot Totals</button>
            <button data-view="pbs">PBs & New</button>
          </div>
          <div class="toolbar-right">
            <select id="spaceEventSelect"></select>
            <button class="ghost-btn" data-export="space">Export CSV</button>
          </div>
        </div>
        <div id="spaceContent"></div>
      </section>

      <section class="page" id="page-kraken">
        <div id="krakenContent"></div>
      </section>

      <section class="page" id="page-trends">
        <div id="trendsContent"></div>
      </section>

      <section class="page" id="page-eventTotals">
        <div id="eventTotalsContent"></div>
      </section>

      <section class="page" id="page-ratings">
        <div id="ratingsContent"></div>
      </section>

      <section class="page" id="page-players">
        <div class="players-toolbar">
          <input id="playerSearch" placeholder="Search player…" autocomplete="off" />
          <div class="small-muted">Search includes active, AV-2, and inactive tracked players. Click a player for their profile and event history.</div>
        </div>
        <div id="playersContent"></div>
      </section>

      <section class="page" id="page-records">
        <div id="recordsContent"></div>
      </section>
    </main>
  </div>

  <div id="playerModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal>×</button>
      <div id="playerModalContent"></div>
    </div>

  <script>

(() => {
  const D = window.AVENGERS_DATA;
  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => [...el.querySelectorAll(s)];
  const state = {
    page: 'overview',
    status: 'active',
    piggyView: 'overall',
    spaceView: 'overall',
    piggyEvent: D.meta.latestPiggy,
    spaceEvent: D.meta.latestSpace,
    piggyPBSort: 'newpb',
    piggyPBEvent: D.meta.latestPiggy,
    spacePBSort: 'newpb',
    spacePBEvent: D.meta.latestSpace,
    rosterView: 'active',
    rosterSort: 'totalCombinedSparks',
    rosterSortDir: 'desc',
    playerSearch: ''
  };

  const PAGE_META = {
    overview:['Overview','Clan performance at a glance'],
    rosters:['Rosters','Current AVENGERS and AV-2 membership with tracked sparks'],
    piggy:['Piggy Race','Overall, event, pot totals, recent-form and personal-best views'],
    space:['Space Race','Lightyears, event results, pot totals and recent-form views'],
    kraken:['Kraken','Monthly damage, personal bests and current-roster performance'],
    trends:['Trends','Clan trends, recent form and player comparisons'],
    eventTotals:['Event Totals','Historical totals for Piggy, Space and Kraken'],
    ratings:['Player Ratings','Combined PB and average performance rating'],
    players:['Players','Individual performance history and profiles'],
    records:['Records','Current AVENGERS benchmark board']
  };

  function escapeHtml(v=''){
    return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  function fmtNum(v, decimals=0){
    const n=Number(v)||0;
    return n.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  }
  function fmtCompact(v){
    const n=Number(v)||0;
    if(Math.abs(n)>=1e9) return (n/1e9).toFixed(n>=1e10?1:2).replace(/\.?0+$/,'')+'B';
    if(Math.abs(n)>=1e6) return (n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,'')+'M';
    if(Math.abs(n)>=1e3) return (n/1e3).toFixed(n>=1e4?1:2).replace(/\.?0+$/,'')+'K';
    return fmtNum(n);
  }
  function fmtB(v){
    const n=Number(v)||0;
    return n.toLocaleString(undefined,{maximumFractionDigits:1})+'B';
  }
  function fmtPct(v, d=1){
    const n=Number(v)||0;
    return (n*100).toLocaleString(undefined,{maximumFractionDigits:d})+'%';
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }
  function initials(name){
    return String(name||'?').replace(/^AV[-.#/\\|]*/i,'').split(/[^A-Za-z0-9]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || 'AV';
  }
  function statusNorm(s){
    const x=String(s||'').toLowerCase().replace(/[-\s]/g,'');
    if(x==='active') return 'active';
    if(x==='av2') return 'av2';
    return 'inactive';
  }
  function statusLabel(s){
    const n=statusNorm(s);
    return n==='active'?'Active':n==='av2'?'AV-2':'Inactive';
  }
  function statusBadge(s){
    const n=statusNorm(s);
    return `<span class="status ${n}">${statusLabel(s)}</span>`;
  }
  function allowedStatus(status){
    const s=statusNorm(status);
    if(state.status==='all') return true;
    if(state.status==='active') return s==='active';
    if(state.status==='av2') return s==='av2';
    return s==='active'||s==='av2';
  }
  function currentMembers(){
    return D.members.filter(m=>allowedStatus(m.status));
  }
  function memberMap(){
    return new Map(D.members.map(m=>[m.name,m]));
  }
  const MEMBERS = memberMap();

  function canonicalPlayerName(name){
    let x=String(name||'');
    const seen=new Set();
    while(D.aliasMap?.[x] && !seen.has(x)){
      seen.add(x);
      x=D.aliasMap[x];
    }
    return x;
  }
  function currentStatusFor(name,fallback=''){
    const canonical=canonicalPlayerName(name);
    return MEMBERS.get(canonical)?.status || MEMBERS.get(name)?.status || fallback || 'Inactive';
  }
  function eventStatusForRow(r){
    const clan=String(r?.clan||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(clan==='avengers') return 'Active';
    if(clan==='av2') return 'AV2';
    const raw=r?.status||'';
    const n=statusNorm(raw);
    if(n==='active'||n==='av2') return raw;
    return currentStatusFor(r?.name,raw);
  }
  function allowedCurrentRow(r){
    return allowedStatus(currentStatusFor(r?.name,r?.status));
  }
  function allowedEventMetricRow(r){
    const s=statusNorm(eventStatusForRow(r));
    if(state.status==='all') return true;
    if(state.status==='active') return s==='active';
    if(state.status==='av2') return s==='av2';
    return s==='active'||s==='av2';
  }
  function piggyEventClan(r){
    const explicit=String(r?.eventClan||r?.raceClan||r?.clan||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(explicit==='avengers'||explicit==='av') return 'AVENGERS';
    if(explicit==='av2') return 'AV2';
    const hasReward=(Number(r?.stars)||0)>0 || (Number(r?.sparks)||0)>0 || (Number(r?.share)||0)>0;
    return hasReward?'AVENGERS':'AV2';
  }
  function piggyRaceRows(date,clan='AVENGERS'){
    const rows=(D.piggy?.events?.[date]||[]).filter(r=>r && r.name && r.name!=='Total' && r.name!=='#N/A' && (Number(r.lines)||0)>0);
    if(clan==='all') return rows;
    return rows.filter(r=>piggyEventClan(r)===clan);
  }
  function piggyPotTotal(date){
    const avRows=piggyRaceRows(date,'AVENGERS');
    const top=avRows.find(r=>Number(r.rank)===1 && (Number(r.share)||0)>0) || avRows.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999))[0];
    if(top){
      let share=Number(top.share)||0;
      if(share>=1) share/=100;
      const sparks=Number(top.sparks)||0;
      if(sparks>0 && share>0) return sparks*10/share;
      const stars=Number(top.stars)||0;
      if(stars>0 && share>0) return stars/share;
    }
    const stored=Number((D.piggy?.events?.[date]||[]).find(r=>r?.name==='Total')?.stars)||0;
    if(stored>0) return stored;
    return avRows.reduce((sum,r)=>sum+(Number(r.stars)||0),0);
  }
  function piggyRowsForSelectedEventRoster(date){
    if(state.status==='av2') return piggyRaceRows(date,'AV2');
    if(state.status==='all') return piggyRaceRows(date,'all');
    return piggyRaceRows(date,'AVENGERS');
  }
  function fmtMillions2(v){
    return ((Number(v)||0)/1000000).toFixed(2)+'M';
  }

  function spaceRewardTotals(date){
    // Historical Space totals are event-clan totals:
    // count everyone who competed as AVENGERS in that event, regardless of current roster status.
    // Explicit AV-2 rows are tracked separately and never contribute to AVENGERS totals.
    const rows=(D.space?.events?.[date]||[]).filter(r=>{
      if(!r||!r.name||r.name==='Total'||r.name==='#N/A'||!(Number(r.yearsB)||0)) return false;
      const clan=String(r.clan||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      return clan!=='av2';
    });
    const stored=D.space?.historicalRewardTotals?.[date]||null;
    const verifiedPot=D.space?.historicalPotTotals?.[date]||null;
    const sum=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
    const rowStarsKnown=rows.some(r=>(Number(r.stars)||0)>0);
    const rowSparksKnown=rows.some(r=>(Number(r.sparks)||0)>0);
    const stars=stored?.stars!=null?Number(stored.stars):(rowStarsKnown?sum('stars'):null);
    const sparks=stored?.sparks!=null?Number(stored.sparks):(rowSparksKnown?sum('sparks'):null);

    const shareFor=r=>{
      let s=Number(r.share)||0;
      if(s>=1) s/=100;
      if(!(s>0)){
        const byRank={1:.25,2:.20,3:.18,4:.12,5:.10,6:.08,7:.04,8:.02,9:.01};
        s=byRank[Number(r.rank)]||0;
      }
      return s;
    };
    const potFrom=(r,key)=>{
      const share=shareFor(r), reward=Number(r[key])||0;
      return share>0&&reward>0?reward/share:null;
    };

    const grouped=new Map();
    rows.forEach(r=>{
      const key=(r.group!==undefined&&r.group!==null&&r.group!=='')?String(r.group):'legacy';
      if(!grouped.has(key)) grouped.set(key,[]);
      grouped.get(key).push(r);
    });
    const lobbyRows=[...grouped.values()];
    const pots=lobbyRows.map(group=>{
      const candidates=group.map(r=>({
        share:shareFor(r),
        star:potFrom(r,'stars'),
        spark:potFrom(r,'sparks')
      })).filter(x=>x.share>0).sort((a,b)=>b.share-a.share);
      return {
        star:candidates.find(x=>x.star>0)?.star??null,
        spark:candidates.find(x=>x.spark>0)?.spark??null
      };
    });
    const starPots=pots.map(x=>x.star).filter(v=>Number(v)>0);
    const sparkPots=pots.map(x=>x.spark).filter(v=>Number(v)>0);
    const allStarPots=lobbyRows.length>0&&starPots.length===lobbyRows.length;
    const allSparkPots=lobbyRows.length>0&&sparkPots.length===lobbyRows.length;

    return {
      date,
      participants:rows.length,
      yearsB:sum('yearsB'),
      stars,
      sparks,
      groups:verifiedPot?.groups??stored?.groups??(grouped.size||(rows.length?1:0)),
      potStars:verifiedPot?.potStars??(allStarPots?starPots.reduce((s,v)=>s+v,0):null),
      potSparks:verifiedPot?.potSparks??(allSparkPots?sparkPots.reduce((s,v)=>s+v,0):null)
    };
  }

  function historyAverage(kind,name,key,startDate='2026-01-01'){
    const hist=(D[kind]?.history?.[name]||[])
      .filter(x=>String(x.date||'')>=startDate && (Number(x[key])||0)>0);
    return hist.length ? hist.reduce((sum,x)=>sum+(Number(x[key])||0),0)/hist.length : 0;
  }

  function maxOf(arr,key){
    return arr.reduce((a,b)=>(Number(b[key])||0)>(Number(a?.[key])||0)?b:a,null);
  }
  function eventCountText(n){ return `${fmtNum(n)} event${Number(n)===1?'':'s'}`; }

  function lineChart(data, key='avg', formatter=fmtNum){
    if(!data || !data.length) return `<div class="empty">No trend data yet.</div>`;
    const w=700,h=230,padL=58,padR=18,padT=28,padB=30;
    const vals=data.map(d=>Number(d[key])||0);
    const min=0, max=Math.max(...vals,1);
    const span=(max-min)||1;
    const pts=data.map((d,i)=>{
      const x=padL + (i/(Math.max(data.length-1,1)))*(w-padL-padR);
      const y=padT + (1-((Number(d[key])-min)/span))*(h-padT-padB);
      return {x,y,d};
    });
    const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const area=path+` L ${pts[pts.length-1].x.toFixed(1)},${h-padB} L ${pts[0].x.toFixed(1)},${h-padB} Z`;
    const dateLabels=pts.filter((_,i)=>i===0||i===pts.length-1||i===Math.floor((pts.length-1)/2));
    const grid=[1,.5,0].map(frac=>({y:padT+(1-frac)*(h-padT-padB),value:max*frac}));
    return `<div class="chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="trend chart">
        <defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#43d7ff"/><stop offset="100%" stop-color="#43d7ff" stop-opacity="0"/></linearGradient></defs>
        ${grid.map(g=>`<line class="chart-grid-line" x1="${padL}" y1="${g.y}" x2="${w-padR}" y2="${g.y}"/><text class="chart-y-label" x="${padL-7}" y="${g.y+4}" text-anchor="end">${escapeHtml(formatter(g.value))}</text>`).join('')}
        <path class="chart-area" d="${area}"></path>
        <path class="chart-line" d="${path}"></path>
        ${pts.map((p,i)=>`<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="4"><title>${fmtDate(p.d.date)}: ${formatter(p.d[key])}</title></circle><text class="chart-value-label" x="${p.x}" y="${Math.max(12,p.y-(i%2?9:7))}" text-anchor="middle">${escapeHtml(formatter(p.d[key]))}</text>`).join('')}
        ${dateLabels.map(p=>`<text class="chart-label" x="${p.x}" y="${h-5}" text-anchor="${p===pts[0]?'start':p===pts[pts.length-1]?'end':'middle'}">${fmtDate(p.d.date).replace(', 2026','')}</text>`).join('')}
      </svg></div>`;
  }

  function rankRows(rows, scoreKey, scoreFmt, metaFn=()=>'', count=5){
    const body=rows.slice(0,count).map((r,i)=>`<tr>
      <td class="num mini-rank-pos">${i+1}</td>
      <td><button class="linkish" data-player="${escapeHtml(r.name)}">${escapeHtml(r.name)}</button></td>
      <td class="mini-rank-meta">${metaFn(r)}</td>
      <td class="num mini-rank-score">${scoreFmt(r[scoreKey])}</td>
    </tr>`).join('');
    return `<div class="mini-table-wrap"><table class="mini-table"><thead><tr><th class="num">#</th><th>Member</th><th>Details</th><th class="num">Value</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function renderOverview(){
    const cm=currentMembers();
    const active=D.members.filter(m=>statusNorm(m.status)==='active').length;
    const av2=D.members.filter(m=>statusNorm(m.status)==='av2').length;
    const topRating=maxOf(cm,'ratingTotal');
    const latestPig=piggyRowsForSelectedEventRoster(D.meta.latestPiggy);
    const latestSpace=(D.space.events[D.meta.latestSpace]||[]).filter(r=>r.name!=='Total'&&r.name!=='#N/A'&&allowedCurrentRow(r));
    const topPig=[...latestPig].sort((a,b)=>b.lines-a.lines);
    const topSp=[...latestSpace].sort((a,b)=>b.yearsB-a.yearsB);
    const pigRecord=maxOf(cm,'piggyPB');
    const spRecord=maxOf(cm,'spacePB');
    const krRecord=maxOf(cm,'krakenPB');

    const participantTrend=(kind,key)=>Object.keys(D[kind].events||{}).sort()
      .filter(date=>date>=D.meta.arenaStart)
      .map(date=>{
        const rows=(D[kind].events[date]||[]).filter(r=>{
          if(!r || r.name==='Total' || r.name==='#N/A' || !(Number(r[key])||0)) return false;
          if(kind==='piggy'){
            if(state.status==='all') return true;
            return piggyEventClan(r)===(state.status==='av2'?'AV2':'AVENGERS');
          }
          return allowedEventMetricRow(r);
        });
        const vals=rows.map(r=>Number(r[key])||0);
        return {date,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,total:vals.reduce((a,b)=>a+b,0),players:vals.length};

  function barCell(value,max,fmt=fmtNum){
    const pct=max>0?Math.max(2,Math.min(100,(Number(value)||0)/max*100)):0;

  function historicalPBs(kind,date,valueKey){
    const K=D[kind]||{};
    const eventRows=(K.events?.[date]||[]).filter(r=>r && r.name && r.name!=='Total' && r.name!=='#N/A' && (Number(r[valueKey])||0)>0);
    const seen=new Set();
    const pbs=[];
    const first=[];
    // Oct. 2 Space Race scores ran on a 66.66% scale. PB comparisons for that
    // event use each player's own prior PB × 0.6666, then convert qualifying
    // scores back to full-scale equivalents for the New PB column.
    const pbScale=(kind==='space' && date==='2026-10-02')?0.6666:1;
    eventRows.forEach(r=>{
      const name=r.name;
      if(seen.has(name)) return;
      seen.add(name);
      const status=MEMBERS.get(name)?.status || r.status || '';
      if(!allowedStatus(status)) return;
      const rawScore=Number(r[valueKey])||0;
      const hist=(K.history?.[name]||[])
        .filter(x=>(Number(x[valueKey])||0)>0)
        .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
      const prior=hist.filter(x=>String(x.date||'')<date);
      if(!prior.length){
        first.push({name,score:rawScore,status});
        return;
      }
      const previous=Math.max(...prior.map(x=>Number(x[valueKey])||0));
      const threshold=previous*pbScale;
      if(rawScore>threshold){
        const score=rawScore/pbScale;
        pbs.push({name,score,previous,improvement:previous>0?(score-previous)/previous:null,status,rawScore});
      }
    });
    return {pbs,first};
  }

        <td>${barCell(r.yearsB,max,v=>fmtB(v))}</td>
        <td class="num">${fmtNum(r.stars)}</td>
        <td class="num">${fmtNum(r.sparks)}</td>
        <td class="num">${fmtPct(r.share)}</td>
        <td class="num">${r.group??'—'}</td>
      </tr>`).join('');
      const eventAll=(D.space.events[state.spaceEvent]||[]).filter(r=>r.name!=='Total'&&r.name!=='#N/A');
      const eventAV=eventAll.filter(r=>statusNorm(eventStatusForRow(r))==='active'&&(Number(r.yearsB)||0)>0);
      const eventAV2=eventAll.filter(r=>statusNorm(eventStatusForRow(r))==='av2'&&(Number(r.yearsB)||0)>0);
      const avAvg=eventAV.length?eventAV.reduce((s,r)=>s+(Number(r.yearsB)||0),0)/eventAV.length:0;
      const avStars=eventAV.reduce((s,r)=>s+(Number(r.stars)||0),0);
      const av2Avg=eventAV2.length?eventAV2.reduce((s,r)=>s+(Number(r.yearsB)||0),0)/eventAV2.length:0;
      const av2Stars=eventAV2.reduce((s,r)=>s+(Number(r.stars)||0),0);
      const split=`<div class="space-event-split">
        <div class="split-stat avengers"><span>AVENGERS</span><strong>${fmtB(avAvg)}</strong><small>${eventAV.length} players • ${fmtCompact(avStars)} stars</small></div>
        <div class="split-divider">≠</div>
        <div class="split-stat av2"><span>AV-2 — separate</span><strong>${eventAV2.length?fmtB(av2Avg):'—'}</strong><small>${eventAV2.length} players • ${fmtCompact(av2Stars)} stars • excluded from AV totals</small></div>
      </div>`;
      el.innerHTML=split+tableShell(`Space Race — ${fmtDate(state.spaceEvent)}`,`${rows.length} players in selected roster view`,
        [{label:'Rank',num:true},{label:'Member'},{label:'Current Status'},{label:'Lightyears'},{label:'Stars',num:true},{label:'Sparks',num:true},{label:'Share',num:true},{label:'Group',num:true}],body||`<tr><td colspan="8" class="empty">No event data.</td></tr>`);
    } else if(view==='last3'){
      const rows=(D.space.overall||[]).filter(r=>allowedStatus(r.status)&&Number(r.avgLast3)>0).map(r=>({
        ...r,
        avg2026:historyAverage('space',r.name,'yearsB','2026-01-01'),
        avgArenaCalc:historyAverage('space',r.name,'yearsB',D.meta.arenaStart)
      })).sort((a,b)=>b.avgLast3-a.avgLast3);
      const max=Math.max(...rows.map(r=>Number(r.avgLast3)||0),1);
      const body=rows.map((r,i)=>{
        const delta=(Number(r.avgLast3)||0)-(Number(r.avgArenaCalc)||0);
        return `<tr>
          <td class="num">${i+1}</td>
          <td><div class="player-cell"><div class="avatar">${initials(r.name)}</div><button class="linkish" data-player="${escapeHtml(r.name)}">${escapeHtml(r.name)}</button></div></td>
          <td>${statusBadge(r.status)}</td>
          <td>${barCell(r.avgLast3,max,v=>fmtB(v))}</td>
          <td class="num">${fmtB(r.avgArenaCalc)}</td>
          <td class="num">${fmtB(r.avg2026)}</td>
          <td class="num ${delta>=0?'positive':'negative'}">${delta>=0?'+':''}${fmtB(delta)}</td>
          <td class="num">${fmtB(r.pb)}</td>
        </tr>`;
      }).join('');
      el.innerHTML=tableShell('Last Three Space Races','Recent form compared with both Arena-era and full-2026 averages',
        [{label:'#',num:true},{label:'Member'},{label:'Status'},{label:'Last 3 Avg'},{label:'Arena Avg',num:true},{label:'2026 Avg',num:true},{label:'Vs Arena',num:true},{label:'PB',num:true}],body);
    } else {
      const dates=Object.keys(D.space.events||{}).sort().reverse();
      if(!D.space.events?.[state.spacePBEvent]) state.spacePBEvent=dates[0]||D.meta.latestSpace;
      const hist=historicalPBs('space',state.spacePBEvent,'yearsB');
      const pbsSorters={
        newpb:(a,b)=>(Number(b.score)||0)-(Number(a.score)||0),
        previouspb:(a,b)=>(Number(b.previous)||0)-(Number(a.previous)||0),
        pctincrease:(a,b)=>(Number(b.improvement)||0)-(Number(a.improvement)||0)
      };
      const pbs=[...hist.pbs].sort(pbsSorters[state.spacePBSort]||pbsSorters.newpb);
      const newM=[...hist.first].sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0));

      const pbRows=pbs.map((x,i)=>`<tr>
        <td class="num">${i+1}</td>
        <td><div class="player-cell compact-player"><div class="avatar">${initials(x.name)}</div><button class="linkish" data-player="${escapeHtml(x.name)}">${escapeHtml(x.name)}</button></div></td>
        <td class="num">${fmtB(x.previous)}</td>
        <td class="num">${fmtB(x.score)}</td>
        <td class="num positive">+${fmtPct(x.improvement||0)}</td>
      </tr>`).join('') || `<tr><td colspan="5" class="empty">No returning-player PBs in this race.</td></tr>`;

      const newRows=newM.map((x,i)=>`<tr>
        <td class="num">${i+1}</td>
        <td><div class="player-cell compact-player"><div class="avatar">${initials(x.name)}</div><button class="linkish" data-player="${escapeHtml(x.name)}">${escapeHtml(x.name)}</button></div></td>
        <td class="num">${fmtB(x.score)}</td>
      </tr>`).join('') || `<tr><td colspan="3" class="empty">No first-time tracked players in this race.</td></tr>`;

      el.innerHTML=`
        <div class="space-pb-toolbar">
          <div>
            <div class="space-pb-toolbar-title">PBs & New</div>
            <div class="small-muted">Choose any tracked Space Race to see the PBs set in that specific event.</div>
          </div>
          <div class="pb-toolbar-controls">
            <label class="inline-control">Event
              <select id="spacePBEventSelect">
                ${dates.map(d=>`<option value="${d}" ${d===state.spacePBEvent?'selected':''}>${fmtDate(d)}</option>`).join('')}
              </select>
            </label>
            <label class="inline-control">Sort personal bests
              <select id="spacePBSortSelect">
                <option value="newpb" ${state.spacePBSort==='newpb'?'selected':''}>New PB</option>
                <option value="previouspb" ${state.spacePBSort==='previouspb'?'selected':''}>Previous PB</option>
                <option value="pctincrease" ${state.spacePBSort==='pctincrease'?'selected':''}>% Increase</option>
              </select>
            </label>
          </div>
        </div>
        <div class="callout-grid tabular-grid">
          ${tableShell('Space Personal Bests',`${fmtDate(state.spacePBEvent)} • ${pbs.length} returning-player PB${pbs.length===1?'':'s'}`,
            [{label:'#',num:true},{label:'Member'},{label:'Previous PB',num:true},{label:'New PB',num:true},{label:'% Increase',num:true}],pbRows)}
          ${tableShell('First Tracked Event',`${newM.length} player${newM.length===1?'':'s'} with no earlier Space result in our data`,
            [{label:'#',num:true},{label:'Member'},{label:'Lightyears',num:true}],newRows)}
        </div>`;
      $('#spacePBEventSelect',el)?.addEventListener('change',e=>{state.spacePBEvent=e.target.value;renderSpace();});
      $('#spacePBSortSelect',el)?.addEventListener('change',e=>{state.spacePBSort=e.target.value;renderSpace();});
    }
    el.insertAdjacentHTML('afterbegin',`
      <div class="roster-separation-note">
        <strong>AVENGERS metrics = Active roster only.</strong>
        AV-2 is tracked separately and is not included in AVENGERS averages or star totals.
      </div>`);
    bindPlayerButtons(el);
  }

  function renderRatings(){
    const rows=currentMembers().filter(r=>Number(r.ratingTotal)>0).sort((a,b)=>b.ratingTotal-a.ratingTotal);
    const max=Math.max(...rows.map(r=>Number(r.ratingTotal)||0),1);
    const body=rows.map((r,i)=>`<tr>
      <td class="num">${i+1}</td>
      <td><div class="player-cell"><div class="avatar">${initials(r.name)}</div><button class="linkish" data-player="${escapeHtml(r.name)}">${escapeHtml(r.name)}</button></div></td>
      <td>${statusBadge(r.status)}</td>
      <td>${barCell(r.ratingTotal,max,v=>fmtNum(v,2))}</td>
      <td class="num">${fmtNum(r.ratingPB,2)}</td>
      <td class="num">${fmtNum(r.ratingAvg,2)}</td>
      <td class="num">${fmtNum(r.piggyPB)}</td>
      <td class="num">${fmtB(r.spacePB)}</td>
      <td class="num">${fmtNum(r.krakenPB,1)}</td>
      <td class="num">${fmtNum(r.piggyAvg)}</td>

      <td class="num">${fmtNum(r.krakenAvgL3)}</td>

    const ratingExplanation = `
      <div class="roster-separation-note">

        Each event can contribute up to <strong>1.00 point</strong> to the Personal Best rating and up to <strong>1.00 point</strong> to the Average rating.
        Scores below the benchmark earn a proportional share of that point; reaching or exceeding the benchmark earns the full 1.00.
        <br><strong>Personal Best benchmarks:</strong> Piggy Race 35,000 lines • Space Race 350B lightyears • Kraken 3,500.
        <br><strong>Average benchmarks:</strong> Piggy Race 25,000 lines • Space Race 200B lightyears • Kraken 2,800.
        Piggy and Space averages use results since August 1, 2026; Kraken uses the last 3 Kraken events.

      [{label:'#',num:true},{label:'Member'},{label:'Status'},{label:'Total Rating'},{label:'PB Rating',num:true},{label:'Avg Rating',num:true},{label:'Piggy PB',num:true},{label:'Space PB',num:true},{label:'Kraken PB',num:true},{label:'Piggy Avg',num:true},{label:'Space Avg',num:true},{label:'Kraken L3',num:true}],body);
    bindPlayerButtons($('#ratingsContent'));
  }

  function renderPlayers(){
    const q=state.playerSearch.trim().toLowerCase();
    // With no query, respect the selected roster/status view. Once the user
    // searches, include every tracked profile so inactive historical members
    // remain discoverable without changing the global roster filter.
    const source=q ? D.members : currentMembers();
    const rows=source.filter(r=>!q||r.name.toLowerCase().includes(q)).sort((a,b)=>b.ratingTotal-a.ratingTotal);
    $('#playersContent').innerHTML = rows.length ? `<div class="player-grid">${rows.map(r=>`
      <button class="player-card" data-player="${escapeHtml(r.name)}">
        <div class="player-top"><div class="avatar">${initials(r.name)}</div><div style="min-width:0"><div class="player-card-name">${escapeHtml(r.name)}</div><div>${statusBadge(r.status)}</div></div></div>
        <div class="rating-large">${fmtNum(r.ratingTotal,2)}</div><div class="rating-label">Player Rating</div>
        <div class="player-mini-stats">
          <div class="mini-stat"><strong>${fmtNum(r.piggyPB)}</strong><span>Piggy PB</span></div>
          <div class="mini-stat"><strong>${fmtB(r.spacePB)}</strong><span>Space PB</span></div>
          <div class="mini-stat"><strong>${Number(r.krakenPB)>0?fmtNum(r.krakenPB,1):'—'}</strong><span>Kraken PB</span></div>
        </div>
      </button>`).join('')}</div>` : `<div class="empty">No matching players.</div>`;
    bindPlayerButtons($('#playersContent'));
  }

  function renderRosters(){
    const root=$('#rostersContent');
    const snap=window.AVENGERS_SPARKS_SNAPSHOT||{currentAvengers:[]};
    const snapRows=snap.currentAvengers||[];
    const tzSource=window.AVENGERS_MEMBER_TIMEZONES||{rows:[],byName:{},formatUtc:v=>String(v??'')};
    const tzByName=tzSource.byName||{};
    const rosterRows=Array.isArray(tzSource.rows)?tzSource.rows:[];
    const currentAvNames=new Set(rosterRows.filter(r=>statusNorm(r.status)==='active').map(r=>r.name));

    // Resolve current roster display names back to the canonical names used by historical stats.
    const baseMap=new Map();
    (D.members||[]).forEach(m=>{
      baseMap.set(m.name,m);
      const canon=tzByName[m.name]?.canonicalName;
      if(canon && !baseMap.has(canon)) baseMap.set(canon,m);
    });

    // Do the same for the Sep 29 Sparks snapshot so renamed players still reconcile correctly.
    const snapMap=new Map();
    snapRows.forEach(x=>{
      snapMap.set(x.name,x);
      const canon=tzByName[x.name]?.canonicalName;
      if(canon && !snapMap.has(canon)) snapMap.set(canon,x);
    });

    // The user-supplied roster is the authoritative population for this page.
    const allNames=new Set(rosterRows.map(r=>r.name));
    const timezoneFor=name=>{
      const direct=tzByName[name];
      if(direct)return direct;
      const alias=D.aliasMap?.[name];
      return alias?tzByName[alias]||null:null;
    };

    const materialize=name=>{
      const canonical=canonicalPlayerName(name);
      const stored=baseMap.get(canonical)||baseMap.get(name);
      const roster=timezoneFor(name)||timezoneFor(canonical);
      const m=stored||{name:canonical||name,status:roster?.status||'Inactive',piggyPB:0,spacePB:0,krakenPB:0,ratingTotal:0,eventsPlayed:0,totalSparks:0};
      const snapshot=snapMap.get(canonical)||snapMap.get(name);
      const logged=Math.max(0,Number(m.totalSparks)||0);
      const snapshotTotal=snapshot?Math.max(0,Number(snapshot.allTimeSparks)||0):null;
      const unlogged=snapshotTotal==null?0:Math.max(0,snapshotTotal-logged);
      const displayStatus=roster?.status||m.status||'Inactive';
      const tz=roster;
      return {...m,name,status:displayStatus,hasProfile:!!stored,
        loggedSparks:logged,unloggedSparks:unlogged,totalCombinedSparks:logged+unlogged,snapshotTotal,
        state:tz?.state||'',location:tz?.location||'',utcOffset:tz?.utc==null?null:Number(tz.utc),
        utcLabel:tz?.utcLabel||'',timeZoneGroup:tz?.timeZoneGroup||''};
    };

    const target=state.rosterView||'active';
    let rows=[],label='';
    if(target==='active'){
      label='AVENGERS';
      rows=rosterRows.filter(r=>statusNorm(r.status)==='active').map(r=>materialize(r.name));
    }else if(target==='av2'){
      label='AV-2';
      rows=rosterRows.filter(r=>statusNorm(r.status)==='av2').map(r=>materialize(r.name));
    }else{
      label='All Members';
      rows=[...allNames].map(materialize);
    }
    const rosterSortDefs={
      name:{label:'Member',type:'text',get:r=>r.name},
      status:{label:'Status',type:'text',get:r=>statusLabel(r.status)},
      utcOffset:{label:'UTC',type:'number',get:r=>r.utcOffset},
      timeZoneGroup:{label:'TZG',type:'number',get:r=>Number(r.timeZoneGroup)||null},
      state:{label:'State',type:'text',get:r=>r.state},
      location:{label:'Location',type:'text',get:r=>r.location},
      loggedSparks:{label:'Logged Sparks',type:'number',get:r=>r.loggedSparks},
      unloggedSparks:{label:'Unlogged Sparks',type:'number',get:r=>r.unloggedSparks},
      totalCombinedSparks:{label:'Total Sparks',type:'number',get:r=>r.totalCombinedSparks},
      ratingTotal:{label:'Rating',type:'number',get:r=>r.ratingTotal},
      piggyPB:{label:'Piggy PB',type:'number',get:r=>r.piggyPB},
      spacePB:{label:'Space PB',type:'number',get:r=>r.spacePB},
      krakenPB:{label:'Kraken PB',type:'number',get:r=>r.krakenPB},
      eventsPlayed:{label:'Events',type:'number',get:r=>r.eventsPlayed}
    };
    const sortKey=rosterSortDefs[state.rosterSort]?state.rosterSort:'totalCombinedSparks';
    const sortDef=rosterSortDefs[sortKey];
    const sortDir=state.rosterSortDir==='asc'?'asc':'desc';
    const dir=sortDir==='asc'?1:-1;
    const isBlank=v=>v==null||String(v).trim()==='';
    rows.sort((a,b)=>{
      const av=sortDef.get(a),bv=sortDef.get(b);
      if(isBlank(av)&&isBlank(bv))return a.name.localeCompare(b.name);
      if(isBlank(av))return 1;
      if(isBlank(bv))return -1;
      let cmp=0;
      if(sortDef.type==='number')cmp=(Number(av)||0)-(Number(bv)||0);
      else cmp=String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:'base'});
      return cmp?cmp*dir:a.name.localeCompare(b.name);
    });

    const sortHeader=(label,key,num=false)=>{
      const active=sortKey===key;
      const arrow=active?(sortDir==='asc'?'▲':'▼'):'↕';
      return {label:`<button class="roster-sort-btn${active?' active':''}" data-roster-sort="${key}" title="Sort by ${label}">${label}<span aria-hidden="true">${arrow}</span></button>`,num};
    };

    const loggedTotal=rows.reduce((s,r)=>s+r.loggedSparks,0);
    const unloggedTotal=rows.reduce((s,r)=>s+r.unloggedSparks,0);
    const combinedTotal=rows.reduce((s,r)=>s+r.totalCombinedSparks,0);

    const zoneMap=new Map();
    rows.forEach(r=>{
      if(!r.timeZoneGroup)return;
      const key=String(r.timeZoneGroup);
      const z=zoneMap.get(key)||{
        tzg:Number(key)||key,
        members:[],
        locations:new Set()
      };
      z.members.push(r.name);
      if(r.location)z.locations.add(r.location);
      zoneMap.set(key,z);
    });
    const zoneGroups=[...zoneMap.values()].sort((a,b)=>Number(a.tzg)-Number(b.tzg));
    const unknownZoneCount=rows.filter(r=>!r.timeZoneGroup).length;
    const zoneGroupsHtml=zoneGroups.length
      ? `<div class="tz-group-wrap">${zoneGroups.map(z=>`
          <div class="tz-group-card">
            <div class="tz-group-offset">TZG ${escapeHtml(String(z.tzg))}</div>
            <div class="tz-group-count">${z.members.length} member${z.members.length===1?'':'s'}</div>
            <div class="tz-group-locations">${escapeHtml([...z.locations].join(' • '))}</div>
          </div>`).join('')}
          ${unknownZoneCount?`<div class="tz-group-card tz-unknown"><div class="tz-group-offset">TZG not assigned</div><div class="tz-group-count">${unknownZoneCount} member${unknownZoneCount===1?'':'s'}</div><div class="tz-group-locations">Blank in the authoritative roster</div></div>`:''}
        </div>`
      : '<div class="small-muted">No TZG information is available for this roster view.</div>';

    const playerNameCell=r=>r.hasProfile
      ? `<button class="linkish" data-player="${escapeHtml(r.name)}">${escapeHtml(r.name)}</button>`
      : `<span class="snapshot-only-name" title="Current roster snapshot; no event history logged yet">${escapeHtml(r.name)}</span>`;

    const body=rows.map((r,i)=>`<tr>
      <td class="num">${i+1}</td>
      <td><div class="player-cell"><div class="avatar">${initials(r.name)}</div>${playerNameCell(r)}</div></td>
      <td>${statusBadge(r.status)}</td>
      <td class="num">${r.utcOffset==null?'<span class="small-muted">—</span>':escapeHtml(String(r.utcOffset))}</td>
      <td>${r.timeZoneGroup?'<span class="tz-pill">'+escapeHtml(r.timeZoneGroup)+'</span>':'<span class="small-muted">—</span>'}</td>
      <td>${r.state?escapeHtml(r.state):'<span class="small-muted">—</span>'}</td>
      <td>${r.location?escapeHtml(r.location):'<span class="small-muted">—</span>'}</td>
      <td class="num">${fmtNum(r.loggedSparks,0)}</td>
      <td class="num roster-unlogged">${fmtNum(r.unloggedSparks,0)}</td>
      <td class="num roster-sparks">${fmtNum(r.totalCombinedSparks,0)}</td>
      <td class="num">${fmtNum(r.ratingTotal,2)}</td>
      <td class="num">${fmtNum(r.piggyPB)}</td>
      <td class="num">${fmtB(r.spacePB)}</td>
      <td class="num">${fmtNum(r.krakenPB,1)}</td>
      <td class="num">${fmtNum(r.eventsPlayed)}</td>
    </tr>`).join('');

    const sourceNote=target==='all'
      ? 'Authoritative Sep 29 roster: Active, AV-2, and Inactive members.'
      : target==='active'
        ? 'Current AVENGERS members from the authoritative Sep 29 roster.'
        : 'Current AV-2 members from the authoritative Sep 29 roster.';

    root.innerHTML=`
      <div class="section-toolbar roster-toolbar">
        <div class="segmented" id="rosterTabs">
          <button data-roster="active" class="${target==='active'?'active':''}">AVENGERS</button>
          <button data-roster="av2" class="${target==='av2'?'active':''}">AV-2</button>
          <button data-roster="all" class="${target==='all'?'active':''}">All Members</button>
        </div>
        <div class="small-muted">${sourceNote}</div>
      </div>
      <div class="roster-summary-grid">
        <div class="kpi"><div class="kpi-label">${label} Members</div><div class="kpi-value">${fmtNum(rows.length)}</div><div class="kpi-note">shown in this view</div></div>
        <div class="kpi"><div class="kpi-label">Logged Sparks</div><div class="kpi-value">${fmtNum(loggedTotal,0)}</div><div class="kpi-note">captured in tracked events</div></div>
        <div class="kpi"><div class="kpi-label">Unlogged Sparks</div><div class="kpi-value">${fmtNum(unloggedTotal,0)}</div><div class="kpi-note">supplemental from all-time screenshot</div></div>
        <div class="kpi"><div class="kpi-label">Combined Total</div><div class="kpi-value">${fmtNum(combinedTotal,0)}</div><div class="kpi-note">logged + unlogged</div></div>
      </div>
      <div class="tz-section">
        <div class="tz-section-head"><strong>Time Zone Groups</strong><span>Three authoritative groups (TZG 1, 2, and 3) from the Sep 29 roster; not calculated from UTC.</span></div>
        ${zoneGroupsHtml}
      </div>
      <div class="records-note roster-location-note"><strong>Roster location source:</strong>
        Status, UTC, TZG, State, and Location come from the authoritative roster supplied Sep 29, 2026. TZG is used exactly as supplied (1, 2, or 3), not inferred from UTC. Blank values remain blank rather than being guessed.
      </div>
      <div class="records-note"><strong>Sparks reconciliation:</strong>
        for players visible in the Sep 29 all-time leaderboard, Unlogged is the amount by which the screenshot total exceeds our logged event total. If the database is already higher, Unlogged stays at 0 so history is never subtracted or double-counted.
      </div>
      ${tableShell(`${label} Sparks Ledger`,`${rows.length} members • sorted by ${sortDef.label} ${sortDir==='asc'?'ascending':'descending'}`,
        [{label:'#',num:true},sortHeader('Member','name'),sortHeader('Status','status'),sortHeader('UTC','utcOffset',true),sortHeader('TZG','timeZoneGroup'),sortHeader('State','state'),sortHeader('Location','location'),sortHeader('Logged Sparks','loggedSparks',true),sortHeader('Unlogged Sparks','unloggedSparks',true),sortHeader('Total Sparks','totalCombinedSparks',true),sortHeader('Rating','ratingTotal',true),sortHeader('Piggy PB','piggyPB',true),sortHeader('Space PB','spacePB',true),sortHeader('Kraken PB','krakenPB',true),sortHeader('Events','eventsPlayed',true)],
        body||`<tr><td colspan="15" class="empty">No roster members found.</td></tr>`)}
    `;

    $('#rosterTabs',root)?.addEventListener('click',e=>{
      const b=e.target.closest('button[data-roster]');
      if(!b)return;
      state.rosterView=b.dataset.roster;
      renderRosters();
    });
    // Replace the roster's delegated sort handler on each render instead of
    // stacking another listener. Stacked handlers caused one click to toggle
    // the direction multiple times, making ascending/descending appear broken.
    root.onclick=e=>{
      const b=e.target.closest('button[data-roster-sort]');
      if(!b)return;
      const key=b.dataset.rosterSort;
      if(state.rosterSort===key) state.rosterSortDir=state.rosterSortDir==='asc'?'desc':'asc';
      else{
        state.rosterSort=key;
        state.rosterSortDir=['name','status','state','location'].includes(key)?'asc':'desc';
      }
      renderRosters();
    };
    bindPlayerButtons(root);
  }

  function renderEventTotals(){
    const root=$('#eventTotalsContent');
    const eventTotals=(kind,key)=>{
      return Object.keys(D[kind]?.events||{}).sort().reverse().map(date=>{
        const all=D[kind].events[date]||[];
        const total=all.find(r=>r?.name==='Total');
        const rows=all.filter(r=>r&&r.name&&r.name!=='Total'&&r.name!=='#N/A');
        const participants=rows.filter(r=>(Number(r[key])||0)>0).length;
        const sum=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
        const pick=k=>{
          const tv=Number(total?.[k])||0;
          return tv>0?tv:sum(k);
        };
        return {date,participants,primary:pick(key),stars:pick('stars'),sparks:pick('sparks')};
      }).filter(x=>x.participants>0||x.primary>0||x.stars>0);
    };
    const pig=Object.keys(D.piggy?.events||{}).sort().reverse().map(date=>{
      const rows=piggyRaceRows(date,'AVENGERS');
      const sum=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
      return {date,participants:rows.length,primary:sum('lines'),stars:piggyPotTotal(date),sparks:sum('sparks')};
    }).filter(x=>x.participants>0||x.primary>0||x.stars>0);
    const sp=Object.keys(D.space?.events||{}).sort().reverse().map(spaceRewardTotals)
      .filter(x=>x.participants>0||x.yearsB>0||x.stars!=null||x.sparks!=null)
      .map(x=>({date:x.date,participants:x.participants,primary:x.yearsB,stars:x.stars,sparks:x.sparks}));
    const K=window.AVENGERS_KRAKEN_DATA||{months:[],players:[]};
    const kr=(K.months||[]).slice().reverse().map(m=>{
      const vals=(K.players||[]).map(p=>Number(p[m.key])||0).filter(v=>v>0);
      return {label:m.label,participants:vals.length,total:vals.reduce((s,v)=>s+v,0),avg:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0};
    }).filter(x=>x.participants);

    const pigRows=pig.map(x=>`<tr><td>${fmtDate(x.date)}</td><td class="num">${fmtNum(x.participants)}</td><td class="num">${fmtNum(x.primary)}</td><td class="num event-total-highlight">${fmtNum(x.stars)}</td><td class="num">${fmtNum(x.sparks)}</td></tr>`).join('');
    const spRows=sp.map(x=>`<tr><td>${fmtDate(x.date)}</td><td class="num">${fmtNum(x.participants)}</td><td class="num">${fmtB(x.primary)}</td><td class="num event-total-highlight">${x.stars==null?'—':fmtNum(x.stars)}</td><td class="num">${x.sparks==null?'—':fmtNum(x.sparks)}</td></tr>`).join('');
    const krRows=kr.map(x=>`<tr><td>${escapeHtml(x.label)} 2026</td><td class="num">${fmtNum(x.participants)}</td><td class="num event-total-highlight">${fmtNum(x.total,1)}</td><td class="num">${fmtNum(x.avg,1)}</td></tr>`).join('');

    root.innerHTML=`
      <div class="records-note">
        <strong>Historical event totals.</strong>
        Piggy participant counts and line totals follow the historical AVENGERS race roster in the workbook, while Pot Stars use the workbook's reward/share values for the full race pot.
      </div>
      <div class="event-totals-grid">
        ${tableShell('Piggy Race Totals','Historical AVENGERS participants with workbook-derived pot totals',
          [{label:'Event'},{label:'Players',num:true},{label:'Total Lines',num:true},{label:'Pot Stars',num:true},{label:'Total Sparks',num:true}],pigRows)}
        ${tableShell('Space Race Totals','All tracked Space events • — means reward data was not captured in the historical source',
          [{label:'Event'},{label:'Players',num:true},{label:'Total Lightyears',num:true},{label:'Total Stars',num:true},{label:'Total Sparks',num:true}],spRows)}
        ${tableShell('Kraken Totals','Sum of recorded monthly player damage scores in the Kraken dataset',
          [{label:'Event'},{label:'Players',num:true},{label:'Total Damage',num:true},{label:'Avg / Player',num:true}],krRows)}
      </div>`;
  }

  function renderRecords(){
    const rows=[...D.members];
    const groups=[
      {title:'Piggy Records',sub:'Lines',key:'piggyPB',fmt:fmtNum,bench:'1.0 PB benchmark: 35,000 lines'},
      {title:'Space Records',sub:'Lightyears',key:'spacePB',fmt:fmtB,bench:'1.0 PB benchmark: 350B lightyears'},
      {title:'Kraken Records',sub:'Score',key:'krakenPB',fmt:v=>fmtNum(v,1),bench:'1.0 PB benchmark: 3,500 score'}
    ];
    $('#recordsContent').innerHTML=`
      <div class="records-note">
        <strong>Full tracked record lists.</strong>
        Rankings include Active, AV-2 and Inactive players; each player's current status is shown beside their name.
      </div>
      <div class="records-grid">${groups.map(g=>{
        const ranked=[...rows].filter(r=>Number(r[g.key])>0).sort((a,b)=>(Number(b[g.key])||0)-(Number(a[g.key])||0));
        return `<div class="card record-card"><div class="card-header"><div><div class="card-title">${g.title}</div><div class="card-sub">${g.sub} • ${ranked.length} tracked players</div></div></div><div class="card-body">
          ${ranked.map((r,i)=>`<div class="record-row">
            <div class="record-badge">${i+1}</div>
            <div class="record-player">
              <button class="linkish" data-player="${escapeHtml(r.name)}">${escapeHtml(r.name)}</button>
              ${statusBadge(r.status)}
            </div>
            <div class="record-value">${g.fmt(r[g.key])}</div>
          </div>`).join('')}
          <div class="benchmark">${g.bench}</div>
        </div></div>`;
      }).join('')}</div>`;
    bindPlayerButtons($('#recordsContent'));
  }

  function playerHistoryChart(hist, valueKey, fmt){
    if(!hist||!hist.length) return `<div class="empty">No event history.</div>`;
    const data=hist.map(x=>({date:x.date,avg:x[valueKey]}));
    return lineChart(data,'avg',fmt);
  }

  function openPlayer(name){
    const canonicalName=canonicalPlayerName(name);
    const m=MEMBERS.get(canonicalName) || MEMBERS.get(name) || D.members.find(x=>x.name===canonicalName||x.name===name);
    if(!m) return;
    name=canonicalName;
    const ph=D.piggy.history[name]||[];
    const sh=D.space.history[name]||[];
    const pigLast=ph.at(-1), spLast=sh.at(-1);

    const K=window.AVENGERS_KRAKEN_DATA||{months:[],players:[]};
    const krakenNameCandidates=[name,D.aliasMap?.[name]].filter(Boolean);
    const kp=(K.players||[]).find(p=>krakenNameCandidates.includes(p.name)) || null;
    const krakenMonthNumber={january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',aug:'08',august:'08',sept:'09',september:'09',october:'10',november:'11',december:'12'};
    const km=(K.months||[]).map(month=>({
      key:month.key,
      label:month.label,
      date:'2026-'+(krakenMonthNumber[String(month.key||'').toLowerCase()]||krakenMonthNumber[String(month.label||'').toLowerCase()]||'01')+'-01',
      value:kp?Number(kp[month.key])||0:0
    })).filter(x=>x.value>0);
    const krakenLast=km.at(-1)||null;
    const krakenAvg=kp?Number(kp.avg)||0:Number(m.krakenAvg)||0;
    const krakenLast3=kp?Number(kp.last3)||0:Number(m.krakenAvgL3)||0;
    const krakenPB=kp?Number(kp.pb)||0:Number(m.krakenPB)||0;
    const krakenPBMonth=kp?.pbMonth||m.krakenPBMonth||'';
    const krakenRows=km.length?km.map(x=>`<tr>
      <td>${escapeHtml(x.label)} 2026</td>
      <td class="num">${fmtNum(x.value,1)}</td>
      <td class="num">${krakenPB>0?fmtPct(x.value/krakenPB,1):'—'}</td>
    </tr>`).join(''):`<tr><td colspan="3" class="empty">No Kraken history logged.</td></tr>`;

    $('#playerModalContent').innerHTML=`
      <div class="profile-head"><div class="avatar">${initials(name)}</div><div><div class="profile-name">${escapeHtml(name)}</div><div class="profile-status">${statusBadge(m.status)}</div></div></div>
      <div class="profile-kpis">
        <div class="profile-kpi"><span>Player Rating</span><strong>${fmtNum(m.ratingTotal,2)}</strong></div>
        <div class="profile-kpi"><span>Piggy PB</span><strong>${fmtNum(m.piggyPB)}</strong></div>
        <div class="profile-kpi"><span>Piggy Avg</span><strong>${fmtNum(m.piggyAvg)}</strong></div>
        <div class="profile-kpi"><span>Space PB</span><strong>${fmtB(m.spacePB)}</strong></div>
        <div class="profile-kpi"><span>Space Avg</span><strong>${fmtB(m.spaceAvg)}</strong></div>
        <div class="profile-kpi"><span>Kraken PB</span><strong>${krakenPB>0?fmtNum(krakenPB,1):'—'}</strong></div>
        <div class="profile-kpi"><span>Kraken Avg</span><strong>${krakenAvg>0?fmtNum(krakenAvg,1):'—'}</strong></div>
        <div class="profile-kpi"><span>Kraken Last 3</span><strong>${krakenLast3>0?fmtNum(krakenLast3,1):'—'}</strong></div>
      </div>
      <div class="profile-charts">
        <div class="profile-chart"><h3>Piggy Lines History</h3>${playerHistoryChart(ph,'lines',fmtNum)}</div>
        <div class="profile-chart"><h3>Space Lightyears History</h3>${playerHistoryChart(sh,'yearsB',fmtB)}</div>
      </div>
      <div class="profile-chart kraken-profile-chart" style="margin-top:14px">
        <h3>Kraken Score History</h3>
        ${km.length?lineChart(km,'value',v=>fmtNum(v,1)):'<div class="empty">No Kraken history logged.</div>'}
      </div>
      <div class="dual-cards" style="margin-top:14px">
        <div class="card"><div class="card-header"><div class="card-title">Piggy Snapshot</div></div><div class="card-body">
          <div class="rank-row"><div class="rank-num">PB</div><div class="rank-name">Personal Best</div><div class="rank-score">${fmtNum(m.piggyPB)}</div></div>
          <div class="rank-row"><div class="rank-num">AVG</div><div class="rank-name">Arena Average</div><div class="rank-score">${fmtNum(m.piggyAvg)}</div></div>
          <div class="rank-row"><div class="rank-num">NOW</div><div class="rank-name">Latest Logged</div><div class="rank-score">${pigLast?fmtNum(pigLast.lines):'—'}</div></div>
        </div></div>
        <div class="card"><div class="card-header"><div class="card-title">Space Snapshot</div></div><div class="card-body">
          <div class="rank-row"><div class="rank-num">PB</div><div class="rank-name">Personal Best</div><div class="rank-score">${fmtB(m.spacePB)}</div></div>
          <div class="rank-row"><div class="rank-num">AVG</div><div class="rank-name">Average</div><div class="rank-score">${fmtB(m.spaceAvg)}</div></div>
          <div class="rank-row"><div class="rank-num">NOW</div><div class="rank-name">Latest Logged</div><div class="rank-score">${spLast?fmtB(spLast.yearsB):'—'}</div></div>
        </div></div>
        <div class="card"><div class="card-header"><div class="card-title">Kraken Snapshot</div></div><div class="card-body">
          <div class="rank-row"><div class="rank-num">PB</div><div class="rank-name">Personal Best${krakenPBMonth?' ('+escapeHtml(String(krakenPBMonth))+')':''}</div><div class="rank-score">${krakenPB>0?fmtNum(krakenPB,1):'—'}</div></div>
          <div class="rank-row"><div class="rank-num">AVG</div><div class="rank-name">All Logged Months</div><div class="rank-score">${krakenAvg>0?fmtNum(krakenAvg,1):'—'}</div></div>
          <div class="rank-row"><div class="rank-num">L3</div><div class="rank-name">Last 3 Kraken Events</div><div class="rank-score">${krakenLast3>0?fmtNum(krakenLast3,1):'—'}</div></div>
          <div class="rank-row"><div class="rank-num">NOW</div><div class="rank-name">Latest Logged${krakenLast?' ('+escapeHtml(krakenLast.label)+')':''}</div><div class="rank-score">${krakenLast?fmtNum(krakenLast.value,1):'—'}</div></div>
        </div></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-header"><div><div class="card-title">Kraken Event Log</div><div class="card-sub">Monthly Kraken score history</div></div></div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Event</th><th class="num">Score</th><th class="num">% of PB</th></tr></thead>
              <tbody>${krakenRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    $('#playerModal').classList.add('open');
    $('#playerModal').setAttribute('aria-hidden','false');
  }
  function closeModal(){
    $('#playerModal').classList.remove('open');
    $('#playerModal').setAttribute('aria-hidden','true');
  }
  function bindPlayerButtons(el=document){
    $$('[data-player]',el).forEach(btn=>btn.onclick=()=>openPlayer(btn.dataset.player));
  }

  function exportCSV(kind){
    let rows=[], headers=[];
    if(kind==='piggy'){
      if(state.piggyView==='event'){
        rows=piggyRowsForSelectedEventRoster(state.piggyEvent);
        headers=['Rank','Username','Lines','Stars','Sparks','Share'];
        rows=rows.map(r=>[r.rank,r.name,r.lines,r.stars,r.sparks,r.share]);
      }else{
        rows=piggyRowsForStatus().sort((a,b)=>b.avgArena-a.avgArena);
        headers=['Rank','Username','Avg Lines Arena','PB','Last 3 Avg','Avg Stars Arena','Avg Sparks Arena','Events'];
        rows=rows.map((r,i)=>[i+1,r.name,r.avgArena,r.pb,r.avgLast3,r.avgStarsArena,r.avgSparksArena,r.eventsPlayed]);
      }
    }else{
      if(state.spaceView==='pot'){
        headers=['Race','Groups','Pot Stars','Pot Sparks','Tracked Stars','Tracked Sparks'];
        rows=Object.keys(D.space.events||{}).sort().reverse().map(spaceRewardTotals)
          .map(x=>[x.date,x.groups||'',x.potStars??'',x.potSparks??'',x.stars??'',x.sparks??'']);
      }else if(state.spaceView==='event'){
        rows=(D.space.events[state.spaceEvent]||[]).filter(r=>allowedStatus(r.status));
        headers=['Rank','Username','Lightyears','Stars','Sparks','Share','Group'];
        rows=rows.map((r,i)=>[i+1,r.name,Math.round((Number(r.yearsB)||0)*1e9),r.stars,r.sparks,r.share,r.group??'']);
      }else{
        rows=spaceRowsForStatus().sort((a,b)=>b.avgYears-a.avgYears);
        headers=['Rank','Username','Avg Lightyears (B)','PB (B)','Last 3 Avg (B)','Avg Stars','Avg Sparks','Events'];
        rows=rows.map((r,i)=>[i+1,r.name,r.avgYears,r.pb,r.avgLast3,r.avgStars,r.avgSparks,r.eventsPlayed]);
      }
    }
    const csv=[headers,...rows].map(row=>row.map(v=>{
      const s=String(v??'');
      return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
    }).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`avengers_${kind}_${kind==='piggy'?(state.piggyView==='event'?state.piggyEvent:state.piggyView):(state.spaceView==='event'?state.spaceEvent:state.spaceView)}.csv`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
  }

  function renderPage(){
    const [title,sub]=PAGE_META[state.page];
    $('#pageTitle').textContent=title;
    $('#pageSubtitle').textContent=sub;
    $$('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${state.page}`));
    $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
    if(state.page==='overview') renderOverview();
    if(state.page==='rosters') renderRosters();
    if(state.page==='piggy') renderPiggy();
    if(state.page==='space') renderSpace();
    if(state.page==='kraken' && window.renderKraken) window.renderKraken();
    if(state.page==='eventTotals') renderEventTotals();
    if(state.page==='ratings') renderRatings();
    if(state.page==='players') renderPlayers();
    if(state.page==='records') renderRecords();
    $('.sidebar').classList.remove('open');
  }

  function fillEventSelects(){
    const pigDates=Object.keys(D.piggy.events).sort().reverse();
    $('#piggyEventSelect').innerHTML=pigDates.map(d=>`<option value="${d}" ${d===state.piggyEvent?'selected':''}>${fmtDate(d)}</option>`).join('');
    const spDates=Object.keys(D.space.events).sort().reverse();
    $('#spaceEventSelect').innerHTML=spDates.map(d=>`<option value="${d}" ${d===state.spaceEvent?'selected':''}>${fmtDate(d)}</option>`).join('');
  }

  // Events
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;renderPage();}));
  $('#globalStatusFilter').addEventListener('change',e=>{state.status=e.target.value;renderPage();});
  $('#piggyTabs').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;state.piggyView=b.dataset.view;$$('#piggyTabs button').forEach(x=>x.classList.toggle('active',x===b));renderPiggy();});
  $('#spaceTabs').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;state.spaceView=b.dataset.view;$$('#spaceTabs button').forEach(x=>x.classList.toggle('active',x===b));renderSpace();});
  $('#piggyEventSelect').addEventListener('change',e=>{state.piggyEvent=e.target.value;state.piggyView='event';$$('#piggyTabs button').forEach(x=>x.classList.toggle('active',x.dataset.view==='event'));renderPiggy();});
  $('#spaceEventSelect').addEventListener('change',e=>{state.spaceEvent=e.target.value;state.spaceView='event';$$('#spaceTabs button').forEach(x=>x.classList.toggle('active',x.dataset.view==='event'));renderSpace();});
  $('#playerSearch').addEventListener('input',e=>{state.playerSearch=e.target.value;renderPlayers();});
  $$('[data-close-modal]').forEach(x=>x.addEventListener('click',closeModal));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  $('#menuBtn').addEventListener('click',()=>$('.sidebar').classList.toggle('open'));
  $('#printBtn').addEventListener('click',()=>window.print());
  $$('[data-export]').forEach(b=>b.addEventListener('click',()=>exportCSV(b.dataset.export)));

  addAuxStyles();
  fillEventSelects();
  $('#generatedAt').textContent=`Generated ${new Date(D.meta.generated).toLocaleString()}`;
  renderPage();
})();
