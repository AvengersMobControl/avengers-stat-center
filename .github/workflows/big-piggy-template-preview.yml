name: Big Piggy v2 template preview
on:
  pull_request:
    paths:
      - 'scripts/render-event-summary.py'
      - 'scripts/automatic-piggy-dispatch-core.cjs'
      - 'scripts/automatic-piggy-dispatch.cjs'
      - 'data/automatic-piggy-dispatch-policy.json'
      - 'scripts/test_render_event_summary.py'
      - 'scripts/roster-piggy-pb-rank.test.cjs'
      - 'scripts/export-event-summary.cjs'
      - 'roster-piggy-pb-rank.js'
  workflow_dispatch:
    inputs:
      event_id:
        description: Canonical final Piggy event ID to preview
        type: string
        default: 'piggy|2026-10-18'
        required: true
permissions:
  contents: read
concurrency:
  group: big-piggy-template-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependency
        run: python -m pip install Pillow==11.3.0
      - name: Run source, rank and renderer tests
        run: |
          node --test scripts/automatic-piggy-dispatch-core.test.cjs scripts/automatic-dispatch-migration.test.cjs scripts/private-dispatch-readiness.test.cjs scripts/roster-piggy-pb-rank.test.cjs scripts/export-event-summary.test.cjs
          python -m unittest scripts/test_render_event_summary.py scripts/test_render_big_piggy_auto.py
      - name: Render AVENGERS and AV-2 review PNGs
        env:
          EVENT_ID: ${{ github.event.inputs.event_id || 'piggy|2026-10-18' }}
        run: node scripts/automatic-piggy-dispatch.cjs preview --event-id "$EVENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: big-piggy-v2-review-${{ github.run_id }}
          path: |
            reports/automatic-piggy-v2-*.png
            reports/automatic-piggy-v2-*.json
            reports/automatic-piggy-v2-*.txt
          if-no-files-found: error
          retention-days: 7
