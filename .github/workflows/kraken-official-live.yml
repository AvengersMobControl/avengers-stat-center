name: Official Kraken live event
on:
  pull_request:
    paths:
      - 'server/kraken-entry-*.cjs'
      - 'api/kraken/**'
      - 'api/discord/kraken-go-live.js'
      - 'scripts/kraken-entry.test.cjs'
      - '.github/workflows/kraken-official-live.yml'
  push:
    branches: [feat/kraken-live-nov14-official-routes]
jobs:
  verify-kraken-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check server/kraken-entry-core.cjs
          node --check server/kraken-entry-store.cjs
          node --check api/kraken/form.js
          node --check api/kraken/data.js
          node --check api/discord/kraken-interactions.js
          node --check api/discord/kraken-go-live.js
      - name: Private Kraken logic, identity and UI
        run: node --test scripts/kraken-entry.test.cjs scripts/discord-confirmed-bindings.test.cjs
