name: Big Piggy approved-result dispatch
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview the pinned v2 report, or run the guarded dispatcher
        type: choice
        options: [preview, dispatch]
        default: preview
        required: true
      event_id:
        description: Canonical Piggy event ID for preview (defaults to latest final)
        type: string
        default: 'piggy|2026-10-18'
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: big-piggy-dispatch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  piggy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependency
        run: python -m pip install Pillow==11.3.0
      - name: Run dispatch safety and projection tests
        run: |
          node --test scripts/automatic-piggy-dispatch-core.test.cjs scripts/automatic-dispatch-migration.test.cjs scripts/private-dispatch-readiness.test.cjs scripts/roster-piggy-pb-rank.test.cjs scripts/export-event-summary.test.cjs
          python -m unittest scripts/test_render_event_summary.py
      - name: Render review-only template preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: node scripts/automatic-piggy-dispatch.cjs preview --event-id "${{ inputs.event_id }}"
      - name: Upload review-only preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: big-piggy-v2-review-${{ github.run_id }}
          path: |
            reports/automatic-piggy-v2-*.png
            reports/automatic-piggy-v2-*.json
            reports/automatic-piggy-v2-*.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run guarded automatic dispatch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dispatch')
        env:
          AVENGERS_PIGGY_DISPATCH_URL: https://avengers-stat-center.vercel.app/api/dispatch-approved-piggy
        run: node scripts/automatic-piggy-dispatch.cjs run
