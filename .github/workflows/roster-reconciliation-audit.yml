name: Audit roster and event ledger
on:
  pull_request:
    paths:
      - 'index.html'
      - '*-snapshot*.js'
      - 'roster-*.js'
      - 'scripts/audit-roster-reconciliation.cjs'
      - '.github/workflows/roster-reconciliation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check roster identities and reconcile rewards
        run: node scripts/audit-roster-reconciliation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-reconciliation-audit
          path: reports/roster-reconciliation-audit.*
          if-no-files-found: warn
